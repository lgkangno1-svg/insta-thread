map $http_cf_connecting_ip $rate_key {
    default $http_cf_connecting_ip;
    "" $binary_remote_addr;
}
limit_req_zone $rate_key zone=analyze_limit:10m rate=20r/m;
limit_req_zone $rate_key zone=job_limit:10m rate=12r/m;
limit_req_zone $rate_key zone=poll_limit:10m rate=120r/m;

server { listen 80; server_name insta.avocadoss.co.kr; return 301 https://download.avocadoss.co.kr/instagram-reels-downloader; }
server { listen 80; server_name thread.avocadoss.co.kr; return 301 https://download.avocadoss.co.kr/threads-downloader; }
server { listen 80; server_name douyin.avocadoss.co.kr; return 301 https://download.avocadoss.co.kr/douyin-downloader; }
server { listen 80; server_name xiaohongshu.avocadoss.co.kr; return 301 https://download.avocadoss.co.kr/xiaohongshu-downloader; }
server { listen 80; server_name youtube.avocadoss.co.kr; return 301 https://download.avocadoss.co.kr/youtube-downloader; }

server {
    listen 80 default_server;
    server_name download.avocadoss.co.kr localhost _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/v1/analyze {
        limit_req zone=analyze_limit burst=8 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $rate_key;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /api/v1/jobs {
        limit_req zone=job_limit burst=4 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $rate_key;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/v1/jobs/ {
        limit_req zone=poll_limit burst=20 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $rate_key;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 900s;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $rate_key;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 900s;
    }

    location = /health { proxy_pass http://api:8000/health; }

    # Public deployment marker used only by automated production QA. The exact
    # Git SHA is intentionally not cached so QA can distinguish a promoted
    # commit from the previous miniPC deployment.
    location = /build.txt {
        default_type text/plain;
        expires epoch;
        try_files $uri =404;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location / { try_files $uri $uri.html $uri/ =404; }
}
