name: Build Windows EXE

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/build-windows-exe.yml"
  push:
    branches:
      - main
      - feature/windows-desktop-exe-20260915
    paths:
      - "desktop/**"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Run desktop tests
        shell: pwsh
        run: python -m unittest discover -s desktop -p "test_*.py" -v

      - name: Install PyInstaller
        shell: pwsh
        run: python -m pip install "pyinstaller>=6.10,<7"

      - name: Build portable EXE
        shell: pwsh
        run: >
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name AVOCADOSS-Downloader
          --paths desktop
          desktop/app.py

      - name: Verify EXE
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/AVOCADOSS-Downloader.exe")) { throw "EXE missing" }
          Get-Item "dist/AVOCADOSS-Downloader.exe" | Format-List Name,Length,LastWriteTime
          Get-FileHash "dist/AVOCADOSS-Downloader.exe" -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: AVOCADOSS-Downloader-Windows
          path: dist/AVOCADOSS-Downloader.exe
          if-no-files-found: error
          retention-days: 30
