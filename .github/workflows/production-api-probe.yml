name: Production API probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-api-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe deployed build and Instagram analysis
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request

          base = 'https://download.avocadoss.co.kr'

          def get(path):
              req = urllib.request.Request(base + path, headers={'User-Agent': 'AVOCADOSS-production-probe/1'})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.status, r.read().decode('utf-8', 'replace')

          for path in ('/build.txt', '/health'):
              try:
                  status, body = get(path)
                  print(f'PROBE_GET path={path} status={status} body={body[:1000]!r}')
              except Exception as exc:
                  print(f'PROBE_GET_ERROR path={path} error={type(exc).__name__}: {exc}')

          payload = json.dumps({'url': 'https://www.instagram.com/p/DdSPlpwGixd/'}).encode('utf-8')
          req = urllib.request.Request(
              base + '/api/v1/analyze',
              data=payload,
              headers={
                  'User-Agent': 'AVOCADOSS-production-probe/1',
                  'Accept': 'application/json',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          try:
              with urllib.request.urlopen(req, timeout=70) as r:
                  body = r.read().decode('utf-8', 'replace')
                  print(f'PROBE_INSTAGRAM status={r.status} body={body[:4000]}')
          except urllib.error.HTTPError as exc:
              body = exc.read().decode('utf-8', 'replace')
              print(f'PROBE_INSTAGRAM_HTTP_ERROR status={exc.code} body={body[:4000]}')
          except Exception as exc:
              print(f'PROBE_INSTAGRAM_ERROR error={type(exc).__name__}: {exc}')
          PY
