name: Windows Desktop EXE

on:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-desktop.yml'
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install desktop build dependencies
        run: python -m pip install --upgrade -r desktop/requirements-build.txt

      - name: Run desktop unit tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path desktop).Path
          python -m unittest desktop/test_core.py desktop/test_instagram_fallback.py -v
          python -m py_compile desktop/core.py desktop/app.py desktop/instagram_fallback.py desktop/instagram_runtime_hook.py desktop/make_windows_resources.py

      - name: Generate Windows icon and version resources
        run: python desktop/make_windows_resources.py

      - name: Build single-file GUI executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name AVOCADOSS-Downloader `
            --paths desktop `
            --runtime-hook desktop/instagram_runtime_hook.py `
            --hidden-import instagram_fallback `
            --icon desktop/assets/app.ico `
            --version-file desktop/assets/version_info.txt `
            --add-data "desktop/VERSION;." `
            --add-data "desktop/assets/app.ico;assets" `
            desktop/app.py
          if (-not (Test-Path dist/AVOCADOSS-Downloader.exe)) { throw 'EXE was not created' }

      - name: Verify executable metadata and checksum
        shell: pwsh
        run: |
          $version = (Get-Content desktop/VERSION -Raw).Trim()
          $file = Get-Item dist/AVOCADOSS-Downloader.exe
          if ($file.Length -lt 1000000) { throw 'EXE is unexpectedly small' }
          $info = $file.VersionInfo
          if ($info.ProductVersion -ne $version) { throw "ProductVersion mismatch: $($info.ProductVersion) vs $version" }
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AVOCADOSS-Downloader.exe" | Set-Content -NoNewline -Encoding ascii dist/AVOCADOSS-Downloader.exe.sha256
          Write-Host "Built $($file.FullName) ($($file.Length) bytes), version $version, SHA256 $hash"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AVOCADOSS-Downloader-Windows
          path: |
            dist/AVOCADOSS-Downloader.exe
            dist/AVOCADOSS-Downloader.exe.sha256
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: AVOCADOSS-Downloader-Windows
          path: release

      - name: Publish versioned desktop release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n ' < desktop/VERSION)"
          tag="desktop-v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$tag" \
            release/AVOCADOSS-Downloader.exe \
            release/AVOCADOSS-Downloader.exe.sha256 \
            --target "$GITHUB_SHA" \
            --title "AVOCADOSS Downloader v${version}" \
            --notes "Ad-free Windows downloader for public YouTube, Instagram, Threads, Douyin and Xiaohongshu/RedNote links. Includes thumbnail preview cards, a local public-Instagram fallback when the production backend is temporarily behind, and SHA-256 verified in-app update support."
