name: Desktop Instagram live smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop-instagram-live-smoke.yml'
      - 'desktop/core.py'
      - 'desktop/instagram_fallback.py'
      - 'desktop/instagram_runtime_hook.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-instagram-fallback:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Exercise local fallback against a current public Instagram post
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path desktop).Path
          @'
          import tempfile
          from pathlib import Path
          import core
          import instagram_fallback

          # Force the normal API path to fail immediately so the exact local
          # Instagram fallback used by the EXE is exercised end-to-end.
          instagram_fallback.patch_api_client(core)
          client = core.ApiClient('http://127.0.0.1:9')
          candidates = [
              'https://www.instagram.com/p/DdSPlpwGixd/',
              'https://www.instagram.com/p/DdHO5pWgWaT/',
              'https://www.instagram.com/p/DdOaZQTEaK2/',
          ]
          errors = []
          for url in candidates:
              try:
                  data = client.analyze(url)
                  assets = core.assets_from_response(data)
                  assert data.get('platform') == 'instagram'
                  assert str(data.get('analysis_token') or '').startswith('local-instagram:')
                  assert assets, 'no media assets returned'
                  asset = assets[0]
                  job_id = client.create_job(url, asset.id, data['analysis_token'])
                  download_url = client.wait_until_ready(job_id)
                  out_dir = Path(tempfile.mkdtemp(prefix='avocadoss-instagram-live-'))
                  saved = client.download_file(download_url, out_dir)
                  size = saved.stat().st_size
                  assert size > 10_000, f'download unexpectedly small: {size}'
                  print(f'LIVE_SMOKE_OK url={url} assets={len(assets)} kind={asset.kind} file={saved.name} bytes={size}')
                  break
              except Exception as exc:
                  errors.append(f'{url}: {type(exc).__name__}: {exc}')
          else:
              raise SystemExit('All public Instagram live-smoke candidates failed:\n' + '\n'.join(errors))
          '@ | python -
