name: Bootstrap full project

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/chunks/**'
      - '.github/workflows/bootstrap-project.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Expand verified project snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(find bootstrap/chunks -maxdepth 1 -type f -name 'chunk-*' | wc -l)" -eq 8
          cat bootstrap/chunks/chunk-* > "$RUNNER_TEMP/project.tar.gz.b64"
          base64 -d "$RUNNER_TEMP/project.tar.gz.b64" > "$RUNNER_TEMP/project.tar.gz"
          echo '92c790a612db14fc60d6e8893f80efec2a934db769ceaf77b1f50fe18e50357a  '"$RUNNER_TEMP/project.tar.gz" | sha256sum -c -
          tar -tzf "$RUNNER_TEMP/project.tar.gz" >/dev/null
          tar -xzf "$RUNNER_TEMP/project.tar.gz" -C .
          rm -rf bootstrap README2.md .github/workflows/bootstrap-project.yml

      - name: Commit expanded project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'insta-thread-bootstrap'
          git config user.email 'insta-thread-bootstrap@users.noreply.github.com'
          git add -A
          git commit -m 'Build unified media downloader MVP' || exit 0
          git push origin HEAD:main
