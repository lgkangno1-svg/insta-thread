name: Source Share Diagnostics

on:
  push:
    branches: [ops/agent-browser-live-qa-20260911]
    paths: ['.github/workflows/source-share-diagnostics.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect source response shapes without printing private data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.request, urllib.error
          from urllib.parse import urljoin, urlparse

          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36'
          targets=[
            ('threads','https://www.threads.com/@dillydally111/post/DdEg-eSktZ2','Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'),
            ('instagram-share','https://www.instagram.com/share/reel/BATba9dkhm',UA),
            ('douyin','https://www.douyin.com/video/7647942099643452724',UA),
            ('douyin-short','https://v.douyin.com/iLSyqNLd/',UA),
            ('xhs-old','http://xhslink.com/m/1gJ5tOG6M1b',UA),
            ('xhs-note','http://xhslink.com/m/6H6cN8mpO3a',UA),
            ('xhs-note2','http://xhslink.com/m/76yG1t3zh5k',UA),
          ]
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, req, fp, code, msg, headers, newurl): return None

          for name,url,ua in targets:
            print(f'=== {name} ===')
            current=url
            for hop in range(7):
              req=urllib.request.Request(current,headers={'User-Agent':ua,'Accept-Language':'en-US,en;q=0.8,zh-CN;q=0.7'})
              try:
                res=urllib.request.build_opener(NoRedirect).open(req,timeout=30)
                code=res.status; headers=res.headers; body=res.read(4_000_000)
              except urllib.error.HTTPError as e:
                code=e.code; headers=e.headers; body=e.read(4_000_000)
              p=urlparse(current)
              print('hop',hop,'code',code,'host',p.hostname,'path',p.path)
              if code in (301,302,303,307,308) and headers.get('Location'):
                current=urljoin(current,headers['Location'])
                t=urlparse(current)
                print('redirect_host',t.hostname,'path',t.path,'query_keys',','.join(sorted({x.split('=',1)[0] for x in t.query.split('&') if x})))
                continue
              text=body.decode('utf-8','replace')
              print('bytes',len(body))
              for marker in ['video_versions','image_versions2','carousel_media','__INITIAL_STATE__','s_v_web_id','web_session','og:url','canonical']:
                print(marker, text.count(marker))
              canon=re.search(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)',text,re.I)
              if not canon:
                canon=re.search(r'<link[^>]+href=["\']([^"\']+)["\'][^>]+rel=["\']canonical["\']',text,re.I)
              if canon:
                c=urlparse(canon.group(1).replace('&amp;','&'))
                print('canonical_host',c.hostname,'canonical_path',c.path,'canonical_query_keys',','.join(sorted({x.split('=',1)[0] for x in c.query.split('&') if x})))
              if name=='threads':
                scripts=re.findall(r'<script[^>]+type=["\']application/json["\'][^>]*>(.*?)</script>',text,re.S|re.I)
                print('json_scripts',len(scripts),'json_script_bytes',sum(len(x) for x in scripts))
                print('shortcode_hits',text.count('DdEg-eSktZ2'))
              break
          PY
