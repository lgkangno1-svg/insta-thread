services:
  web:
    build:
      context: ./web
      args:
        BUILD_SHA: ${BUILD_SHA:-dev}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_BIND_PORT:-8080}:80"
    depends_on:
      - api

  api:
    build: ./backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      YTDLP_POT_PROVIDER_URL: http://bgutil-provider:4416
      CORS_ORIGINS: https://download.avocadoss.co.kr
      YTDLP_SOCKET_TIMEOUT: 30
      DOWNLOAD_WORKERS: 2
      JOB_TTL_SECONDS: ${JOB_TTL_SECONDS:-1800}
      READY_JOB_TTL_SECONDS: ${READY_JOB_TTL_SECONDS:-600}
      ERROR_JOB_TTL_SECONDS: ${ERROR_JOB_TTL_SECONDS:-120}
      MAX_JOBS: ${MAX_JOBS:-100}
      MAX_MEDIA_MB: ${MAX_MEDIA_MB:-750}
      MIN_FREE_GB: ${MIN_FREE_GB:-5}
      MEDIA_TMP_DIR: /data/tmp
      DOWNLOAD_TOKEN_SECRET: ${DOWNLOAD_TOKEN_SECRET:-}
      ANALYSIS_TOKEN_TTL_SECONDS: ${ANALYSIS_TOKEN_TTL_SECONDS:-900}
      SPONSOR_GATE_ENABLED: ${SPONSOR_GATE_ENABLED:-false}
      SPONSOR_GATE_SECONDS: ${SPONSOR_GATE_SECONDS:-4}
      MONETIZATION_ENABLED: ${MONETIZATION_ENABLED:-false}
      MONETIZATION_CAMPAIGN_ID: ${MONETIZATION_CAMPAIGN_ID:-}
      MONETIZATION_SPONSOR_URL: ${MONETIZATION_SPONSOR_URL:-}
      MONETIZATION_DELAY_SECONDS: ${MONETIZATION_DELAY_SECONDS:-4}
      MONETIZATION_FREQUENCY: ${MONETIZATION_FREQUENCY:-1}
      MONETIZATION_SPONSOR_LABEL: ${MONETIZATION_SPONSOR_LABEL:-Sponsored message}
      MONETIZATION_SPONSOR_TITLE: ${MONETIZATION_SPONSOR_TITLE:-A short message from our sponsor}
      MONETIZATION_SPONSOR_TEXT: ${MONETIZATION_SPONSOR_TEXT:-}
      MONETIZATION_SPONSOR_CTA: ${MONETIZATION_SPONSOR_CTA:-Visit sponsor}
      MONETIZATION_DISCLOSURE: ${MONETIZATION_DISCLOSURE:-Some links may be affiliate links. A purchase may generate a commission at no extra cost to you.}
      MONETIZATION_METRICS_FILE: ${MONETIZATION_METRICS_FILE:-/data/metrics/monetization.json}
      ENABLE_DIRECT_DOWNLOAD: ${ENABLE_DIRECT_DOWNLOAD:-false}
    depends_on:
      - bgutil-provider
    volumes:
      - ./data/tmp:/data/tmp
      - ./data/metrics:/data/metrics

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    expose:
      - "4416"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web
